<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>摸鱼小乌龟 v1.3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='35' fill='%236bbf8a'/%3E%3Ccircle cx='80' cy='45' r='12' fill='%236bbf8a'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(180deg, #c9e9f5 0%, #a8d8ea 40%, #7fc4dd 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
    user-select: none;
  }

  /* ===== 顶部状态栏 ===== */
  .topbar {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 10px 16px;
    box-shadow: 0 2px 10px rgba(0,80,120,0.1);
    margin-bottom: 12px;
  }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #2c5a6e; font-weight: 600; }
  .stat .icon { font-size: 18px; }
  .stat .num { font-variant-numeric: tabular-nums; }

  /* ===== 池塘 ===== */
  .pond {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 16/10;
    background: radial-gradient(ellipse at center, #8fd4e8 0%, #5fb3d1 70%, #4a9cc0 100%);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 8px 24px rgba(0,60,100,0.25), 0 4px 16px rgba(0,80,120,0.15);
    margin-bottom: 12px;
  }
  /* 水面波纹 */
  .pond::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.25) 0%, transparent 8%),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.18) 0%, transparent 6%),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,0.15) 0%, transparent 7%);
    pointer-events: none;
  }
  /* 水草装饰 */
  .seaweed {
    position: absolute;
    bottom: 0;
    width: 14px;
    background: linear-gradient(180deg, #4a9d6e, #2d7a4f);
    border-radius: 8px 8px 0 0;
    transform-origin: bottom center;
    animation: sway 3.5s ease-in-out infinite;
  }
  .seaweed.s1 { left: 8%;  height: 60px; animation-delay: 0s; }
  .seaweed.s2 { left: 88%; height: 80px; animation-delay: 0.8s; width: 18px; }
  .seaweed.s3 { left: 50%; height: 40px; animation-delay: 1.6s; width: 10px; opacity: 0.7; }
  @keyframes sway {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }

  /* 气泡 */
  .bubble {
    position: absolute;
    bottom: -20px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    10%  { opacity: 0.8; }
    100% { transform: translateY(-380px) scale(1.2); opacity: 0; }
  }

  /* ===== 乌龟 ===== */
  .turtle-wrap {
    position: absolute;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    animation: float 3s ease-in-out infinite;
    cursor: pointer;
    transition: transform 0.3s;
  }
  .turtle-wrap:active { transform: translate(-50%, -50%) scale(0.95); }
  @keyframes float {
    0%, 100% { transform: translate(-50%, -55%); }
    50%      { transform: translate(-50%, -60%); }
  }
  .turtle-svg { width: 160px; height: auto; display: block; }

  /* 点击爱心 */
  .heart {
    position: absolute;
    font-size: 20px;
    pointer-events: none;
    animation: heartFly 1s ease-out forwards;
    color: #ff6b8a;
    font-weight: bold;
  }
  @keyframes heartFly {
    0%   { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-80px) scale(1.3); opacity: 0; }
  }

  /* ===== 状态条 ===== */
  .panel {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 12px 16px;
    box-shadow: 0 2px 10px rgba(0,80,120,0.1);
    margin-bottom: 12px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
  }
  .bar-label {
    width: 48px;
    font-size: 13px;
    color: #2c5a6e;
    font-weight: 600;
    flex-shrink: 0;
  }
  .bar-track {
    flex: 1;
    height: 10px;
    background: rgba(44,90,110,0.12);
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.4s ease;
  }
  .fill-hungry { background: linear-gradient(90deg, #ffb84d, #ff8c42); }
  .fill-mood   { background: linear-gradient(90deg, #ff8fb3, #ff5c8a); }
  .fill-clean  { background: linear-gradient(90deg, #7fd6a0, #3cb371); }

  /* ===== 按钮 ===== */
  .actions {
    width: 100%;
    max-width: 480px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }
  .btn-boost { background: linear-gradient(180deg, #a89ee8, #7e6bd4); }
  .btn-challenge {
    grid-column: span 2;
    background: linear-gradient(180deg, #ff7a7a, #e04545);
  }
  .btn-adventure {
    grid-column: span 2;
    background: linear-gradient(180deg, #5ca8e8, #3a7ac4);
  }
  .btn-wardrobe { background: linear-gradient(180deg, #f49ac1, #d96aa0); }
  .btn-decor    { background: linear-gradient(180deg, #6fd4c2, #3aa892); }
  .btn-plaza    { background: linear-gradient(180deg, #c9a8e8, #9c73c4); }

  /* 次级功能按钮行 */
  .sub-actions {
    width: 100%;
    max-width: 480px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .sub-btn {
    border: none;
    border-radius: 12px;
    padding: 10px 4px;
    font-size: 12px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .sub-btn .emoji { font-size: 18px; }
  .sub-btn .cost { font-size: 9px; opacity: 0.9; font-weight: 400; }
  .sub-challenge { background: linear-gradient(180deg, #ff7a7a, #e04545); }
  .sub-adventure { background: linear-gradient(180deg, #5ca8e8, #3a7ac4); }
  .sub-plaza     { background: linear-gradient(180deg, #c9a8e8, #9c73c4); }
  .sub-wardrobe  { background: linear-gradient(180deg, #f49ac1, #d96aa0); }
  .sub-decor     { background: linear-gradient(180deg, #6fd4c2, #3aa892); }

  /* ===== 闯关模式 ===== */
  .game-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #c9e9f5 0%, #7fc4dd 100%);
    z-index: 200;
    display: none;
    flex-direction: column;
    padding: 16px;
  }
  .game-overlay.active { display: flex; }
  .game-hud {
    width: 100%;
    max-width: 480px;
    margin: 0 auto 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.8);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 14px;
    color: #2c5a6e;
    font-weight: 600;
  }
  .game-hud .quit {
    background: #ddd;
    border: none;
    border-radius: 12px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    color: #555;
  }
  .game-arena {
    flex: 1;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    background: radial-gradient(ellipse at center, #8fd4e8 0%, #5fb3d1 70%, #4a9cc0 100%);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 8px 24px rgba(0,60,100,0.25);
  }
  .mole {
    position: absolute;
    width: 60px;
    height: 50px;
    cursor: pointer;
    transform: translateY(120%);
    transition: transform 0.15s ease-out;
    pointer-events: auto;
  }
  .mole.up { transform: translateY(0); }
  .mole svg { width: 100%; height: 100%; display: block; }
  .score-pop {
    position: absolute;
    font-size: 18px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    pointer-events: none;
    animation: heartFly 0.8s ease-out forwards;
  }
  .game-result {
    position: absolute;
    inset: 0;
    background: rgba(0,40,70,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    padding: 20px;
  }
  .game-result h2 { font-size: 26px; margin-bottom: 8px; }
  .game-result p  { font-size: 14px; margin-bottom: 20px; opacity: 0.9; }
  .game-result .btns { display: flex; gap: 10px; }
  .game-result button {
    border: none;
    border-radius: 20px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-retry  { background: #ff8c42; color: white; }
  .btn-exit   { background: white; color: #333; }
  .countdown {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    font-weight: 900;
    color: white;
    text-shadow: 0 4px 12px rgba(0,0,0,0.4);
    pointer-events: none;
  }

  /* ===== 冒险模式 ===== */
  .adv-overlay {
    position: fixed;
    inset: 0;
    background: #5c94b8;
    z-index: 300;
    display: none;
    flex-direction: column;
    padding: 10px;
    overflow: hidden;
  }
  .adv-overlay.active { display: flex; }
  .adv-hud {
    max-width: 960px;
    width: 100%;
    margin: 0 auto 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    font-size: 13px;
    font-weight: 600;
  }
  .adv-hud button {
    background: rgba(255,255,255,0.25);
    border: none;
    color: white;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .adv-canvas-wrap {
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #advCanvas {
    width: 100%;
    flex: 1;
    background: #7ec8e8;
    border-radius: 12px;
    display: block;
  }
  .adv-touch {
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    padding: 0 10px;
  }
  .adv-touch .pad { display: flex; gap: 10px; }
  .tbtn2 {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.5);
    color: white;
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .adv-modal {
    position: absolute;
    inset: 0;
    background: rgba(0,30,60,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    z-index: 10;
    padding: 20px;
  }
  .adv-modal h2 { font-size: 28px; margin-bottom: 10px; }
  .adv-modal p  { font-size: 13px; line-height: 1.7; margin-bottom: 20px; opacity: 0.9; }
  .adv-modal button {
    background: #ff8c42;
    color: white;
    border: none;
    padding: 12px 32px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .adv-modal.hidden { display: none; }

  /* ===== 通用商店/弹层 ===== */
  .shop-overlay {
    position: fixed; inset: 0;
    background: rgba(0,30,60,0.85);
    z-index: 400;
    display: none;
    overflow-y: auto;
    padding: 20px;
  }
  .shop-overlay.active { display: block; }
  .shop-card {
    max-width: 480px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    padding: 20px;
  }
  .shop-card h2 { color: #2c5a6e; margin-bottom: 4px; font-size: 20px; }
  .shop-card .sub { color: #888; font-size: 12px; margin-bottom: 16px; }
  .shop-tabs {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .shop-tab {
    padding: 6px 12px; border-radius: 14px;
    background: #eef2f5; color: #666; font-size: 12px;
    cursor: pointer; border: none;
  }
  .shop-tab.active { background: #ff8c42; color: white; }
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .shop-item {
    background: #f7fafc;
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .shop-item:hover { transform: translateY(-2px); }
  .shop-item.equipped { border-color: #ff8c42; background: #fff5ec; }
  .shop-item .preview {
    height: 50px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 4px;
  }
  .shop-item .name { font-size: 11px; color: #444; margin-bottom: 2px; }
  .shop-item .price { font-size: 11px; color: #ff8c42; font-weight: 600; }
  .shop-item .owned { font-size: 11px; color: #3cb371; font-weight: 600; }
  .shop-close {
    display: block; margin: 16px auto 0;
    background: #666; color: white; border: none;
    padding: 10px 28px; border-radius: 20px; font-size: 14px; cursor: pointer;
  }

  /* ===== 广场 ===== */
  .plaza-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #c9e9f5, #7fc4dd);
    z-index: 400;
    display: none;
    flex-direction: column;
    padding: 16px;
    overflow-y: auto;
  }
  .plaza-overlay.active { display: flex; }
  .plaza-header {
    max-width: 480px; width: 100%; margin: 0 auto 12px;
    display: flex; justify-content: space-between; align-items: center;
    color: #2c5a6e;
  }
  .plaza-header h2 { font-size: 20px; }
  .plaza-header button {
    background: rgba(255,255,255,0.7); border: none;
    padding: 6px 14px; border-radius: 14px; font-size: 12px; cursor: pointer;
  }
  .plaza-grid {
    max-width: 480px; width: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .turtle-card {
    background: rgba(255,255,255,0.85);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }
  .turtle-card .avatar {
    height: 70px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 6px;
  }
  .turtle-card .tname { font-size: 14px; font-weight: 700; color: #2c5a6e; }
  .turtle-card .tid { font-size: 10px; color: #999; margin-bottom: 4px; }
  .turtle-card .tstats { font-size: 11px; color: #666; }
  .turtle-card.me { border: 2px solid #ff8c42; }
  .plaza-tip {
    max-width: 480px; margin: 12px auto 0;
    background: rgba(255,255,255,0.6);
    border-radius: 12px; padding: 10px 14px;
    font-size: 12px; color: #555; text-align: center;
  }
  .btn {
    border: none;
    border-radius: 14px;
    padding: 12px 8px;
    font-size: 14px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .btn .cost { font-size: 11px; opacity: 0.9; font-weight: 400; }
  .btn-feed  { background: linear-gradient(180deg, #ffb84d, #ff8c42); }
  .btn-play  { background: linear-gradient(180deg, #ff8fb3, #ff5c8a); }
  .btn-clean { background: linear-gradient(180deg, #7fd6a0, #3cb371); }

  /* ===== 等级信息 ===== */
  .level-info {
    width: 100%;
    max-width: 480px;
    text-align: center;
    color: #2c5a6e;
    font-size: 13px;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .level-info b { color: #ff8c42; }

  /* 升级提示 */
  .toast {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(44,90,110,0.9);
    color: white;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 99;
  }
  .toast.show { opacity: 1; }

  /* 离线提示 */
  .offline-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .offline-card {
    background: white;
    border-radius: 20px;
    padding: 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
  }
  .offline-card h3 { color: #2c5a6e; margin-bottom: 10px; font-size: 18px; }
  .offline-card p { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
  .offline-card button {
    background: #ff8c42;
    color: white;
    border: none;
    padding: 10px 28px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  /* 移动端适配（手机/平板） */
  @media (max-width: 768px) {
    body { padding: 10px; }
    .topbar, .pond, .panel, .actions, .sub-actions, .game-hud, .game-arena, .adv-hud {
      max-width: 100%;
    }
    .turtle-svg { width: 130px; }
    .stat { font-size: 12px; }
    .stat .icon { font-size: 16px; }
    /* 冒险画布自适应 */
    .adv-canvas-wrap canvas { width: 100% !important; height: auto !important; }
    .adv-canvas-wrap { width: 100%; }
    /* 覆盖层卡片在手机上占满 */
    .shop-card, .plaza-card, .game-modal, .adv-modal { width: 92vw; max-width: 400px; }
    .shop-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .plaza-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .auth-card { max-width: 100%; padding: 24px 18px; }
    .pond { aspect-ratio: 16/10; }
  }
  @media (max-width: 400px) {
    body { padding: 6px; }
    .actions { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .sub-actions { grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .topbar { padding: 8px 10px; }
    .btn { font-size: 13px; padding: 10px 6px; }
    .sub-btn { font-size: 11px; padding: 8px 3px; }
  }

  /* ===== 登录界面 ===== */
  .auth-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: linear-gradient(180deg, #c9e9f5 0%, #7fc4dd 100%);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .auth-overlay.hidden { display: none; }
  .auth-card {
    width: 100%; max-width: 360px; background: rgba(255,255,255,0.92);
    border-radius: 24px; padding: 28px 24px; box-shadow: 0 8px 30px rgba(0,60,100,0.2);
    text-align: center;
  }
  .auth-card h1 { font-size: 26px; color: #2c5a6e; margin-bottom: 4px; }
  .auth-card .sub { color: #5a8295; font-size: 13px; margin-bottom: 20px; }
  .auth-field { width: 100%; padding: 12px 14px; border: 2px solid #cfe3ee; border-radius: 12px; font-size: 15px; margin-bottom: 10px; box-sizing: border-box; }
  .auth-field:focus { outline: none; border-color: #7fc4dd; }
  .auth-btn { width: 100%; padding: 13px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; color: #fff; background: linear-gradient(180deg, #5ca8e8, #3a7ac4); margin-top: 6px; }
  .auth-btn.secondary { background: linear-gradient(180deg, #6fd4c2, #3aa892); margin-top: 10px; }
  .auth-switch { margin-top: 16px; font-size: 13px; color: #5a8295; }
  .auth-switch a { color: #3a7ac4; cursor: pointer; font-weight: 600; }
  .auth-err { color: #e04545; font-size: 13px; min-height: 18px; margin-top: 8px; }

<script>
// 阻止移动端页面缩放（双指 / 双击）
document.addEventListener('touchmove', function(e){ if(e.touches && e.touches.length>1){ e.preventDefault(); } }, {passive:false});
var lastTap = 0;
document.addEventListener('touchend', function(e){ var now = Date.now(); if(now - lastTap < 400){ e.preventDefault(); } lastTap = now; }, {passive:false});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
</script>

<script>
// ===== 游戏状态 =====
const DEFAULT_STATE = {
  coins: 20,
  level: 1,
  age: 0,
  expInLevel: 0,
  hungry: 80,
  mood: 80,
  clean: 80,
  lastTick: Date.now(),
  name: "小乌龟",
  wardrobe: { hat: "none", glasses: "none", outfit: "none", shoes: "none" },
  owned: { hats: ["none"], glasses: ["none"], outfits: ["none"], shoes: ["none"], decor: [] }
};
let state = load();

// 等级配置：每级需要的秒数，乌龟外观
const LEVELS = [
  { minAge: 0,   name: "小绿龟", scale: 1.0,  shellColor: "#6bbf8a", shellDark: "#4a9e6b", headColor: "#7ccb92", next: 30 },
  { minAge: 30,  name: "青壳龟", scale: 1.1,  shellColor: "#5fa87a", shellDark: "#3d8a5e", headColor: "#6ab57e", next: 90 },
  { minAge: 120, name: "金甲龟", scale: 1.2,  shellColor: "#d4a84a", shellDark: "#b08830", headColor: "#e0bb60", next: 300 },
  { minAge: 420, name: "灵龟",   scale: 1.35, shellColor: "#7e6bd4", shellDark: "#5c4ba8", headColor: "#9582e0", next: 900 },
  { minAge: 1320,name: "神龟",   scale: 1.5,  shellColor: "#e86ba0", shellDark: "#c44a82", headColor: "#f08ab5", next: null }
];

// ===== 存档 =====
function load() {
  try {
    const raw = localStorage.getItem("turtlePet");
    if (!raw) return { ...DEFAULT_STATE };
    const s = JSON.parse(raw);
    return { ...DEFAULT_STATE, ...s };
  } catch(e) { return { ...DEFAULT_STATE }; }
}
function save() {
  state.lastTick = Date.now();
  localStorage.setItem("turtlePet", JSON.stringify(state));
}

// ===== 离线结算 =====
function settleOffline() {
  const now = Date.now();
  const dt = Math.floor((now - (state.lastTick || now)) / 1000);
  if (dt < 5) return;

  // 离线最多累计 8 小时
  const capped = Math.min(dt, 8 * 3600);
  // 离线金币收益 = 每秒 base * 状态系数 * 秒数
  const rate = getCoinRate();
  const earned = Math.floor(capped * rate * 0.5); // 离线收益打五折
  state.coins += earned;

  // 状态自然消耗
  state.hungry = clamp(state.hungry - capped * 0.05, 0, 100);
  state.mood   = clamp(state.mood   - capped * 0.04, 0, 100);
  state.clean  = clamp(state.clean  - capped * 0.03, 0, 100);
  state.age += capped;
  state.expInLevel += capped;

  // 升级
  checkLevelUp();

  if (earned > 0) {
    showOfflineModal(formatTime(capped), earned);
  }
  save();
}

// ===== 工具 =====
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function formatTime(sec) {
  if (sec < 60) return sec + "秒";
  if (sec < 3600) return Math.floor(sec/60) + "分钟";
  return Math.floor(sec/3600) + "小时" + Math.floor((sec%3600)/60) + "分";
}
function getCoinRate() {
  // 基础 0.5/秒 + 等级加成 + 状态加成
  const levelBonus = (state.level - 1) * 0.2;
  const avg = (state.hungry + state.mood + state.clean) / 3 / 100;
  return (0.5 + levelBonus) * (0.5 + avg);
}

// ===== 升级 =====
function getCurrentLevelIdx() {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) {
    if (state.age >= LEVELS[i].minAge) idx = i;
  }
  return idx;
}
function checkLevelUp() {
  const curIdx = getCurrentLevelIdx();
  if (curIdx + 1 !== state.level) {
    const old = state.level;
    state.level = curIdx + 1;
    const cfg = LEVELS[curIdx];
    toast(`升级啦！${cfg.name} 出现了！`);
    sfxLevel();
    applyTurtleSkin();
  }
}

// ===== 动作 =====
function spend(cost) {
  if (state.coins < cost) { toast("金币不够啦，再等等~"); return false; }
  state.coins -= cost;
  return true;
}
function feed() {
  if (!spend(5)) return;
  state.hungry = clamp(state.hungry + 25, 0, 100);
  spawnHeart("🍎");
  sfxFeed();
  save(); render();
}
function play() {
  if (!spend(8)) return;
  state.mood = clamp(state.mood + 30, 0, 100);
  spawnHeart("💕");
  save(); render();
}
function clean() {
  if (!spend(6)) return;
  state.clean = clamp(state.clean + 30, 0, 100);
  spawnHeart("💧");
  save(); render();
}
function boost() {
  if (!spend(20)) return;
  const gain = 25;
  state.age += gain;
  state.expInLevel += gain;
  checkLevelUp();
  spawnHeart("✨");
  sfxBoost();
  toast(`时间飞逝！乌龟长大了 ${gain} 秒`);
  save(); render();
}

// ===== 闯关模式 =====
const ROUND_CONFIG = [
  { goal: 5,  duration: 1200, reward: 20 },
  { goal: 7,  duration: 1000, reward: 30 },
  { goal: 9,  duration: 850,  reward: 50 },
  { goal: 11, duration: 700,  reward: 80 },
  { goal: 13, duration: 600,  reward: 120 },
];
const game = {
  level: 1, hit: 0, timeLeft: 10,
  playing: false, timers: [], spawnTimer: null
};

function getCfg(lv) {
  return ROUND_CONFIG[Math.min(lv - 1, ROUND_CONFIG.length - 1)];
}

function startGame() {
  game.level = 1;
  document.getElementById("gameOverlay").classList.add("active");
  countDownThenPlay();
}

function countDownThenPlay() {
  const cd = document.getElementById("countdown");
  cd.style.display = "flex";
  let n = 3;
  cd.textContent = n;
  const t = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(t);
      cd.style.display = "none";
      playRound();
    } else {
      cd.textContent = n;
    }
  }, 700);
}

function playRound() {
  const cfg = getCfg(game.level);
  game.hit = 0;
  game.timeLeft = 10;
  game.playing = true;
  updateHUD();

  // 清空场上残留
  document.querySelectorAll(".mole").forEach(m => m.remove());

  // 倒计时
  game.timers.push(setInterval(() => {
    game.timeLeft--;
    updateHUD();
    if (game.timeLeft <= 0) endRound();
  }, 1000));

  // 持续冒乌龟
  scheduleSpawn();
}

function scheduleSpawn() {
  if (!game.playing) return;
  const cfg = getCfg(game.level);
  game.spawnTimer = setTimeout(() => {
    spawnMole(cfg.duration);
    scheduleSpawn();
  }, 500 + Math.random() * 400);
}

function spawnMole(duration) {
  const arena = document.getElementById("arena");
  const rect = arena.getBoundingClientRect();
  const mole = document.createElement("div");
  mole.className = "mole";
  mole.innerHTML = `
    <svg viewBox="0 0 80 60">
      <ellipse cx="40" cy="38" rx="28" ry="20" fill="#6bbf8a"/>
      <circle cx="66" cy="32" r="10" fill="#7ccb92"/>
      <circle cx="69" cy="30" r="2" fill="#2c3e50"/>
      <ellipse cx="22" cy="52" rx="6" ry="4" fill="#5a9e6e"/>
      <ellipse cx="50" cy="52" rx="6" ry="4" fill="#5a9e6e"/>
    </svg>`;
  // 随机位置（底部 80% 区域）
  const x = Math.random() * (rect.width - 70);
  const y = rect.height * 0.35 + Math.random() * (rect.height * 0.55 - 50);
  mole.style.left = x + "px";
  mole.style.top = y + "px";
  mole.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    hitMole(mole, x, y);
  });
  arena.appendChild(mole);
  // 冒上来
  requestAnimationFrame(() => mole.classList.add("up"));
  // 时间到缩回去
  setTimeout(() => {
    mole.classList.remove("up");
    setTimeout(() => mole.remove(), 200);
  }, duration);
}

function hitMole(mole, x, y) {
  if (!game.playing) return;
  game.hit++;
  const reward = 10;
  state.coins += reward;
  sfxCoin();

  // 飘字
  const arena = document.getElementById("arena");
  const pop = document.createElement("div");
  pop.className = "score-pop";
  pop.textContent = "+" + reward;
  pop.style.left = x + 20 + "px";
  pop.style.top  = y + "px";
  arena.appendChild(pop);
  setTimeout(() => pop.remove(), 800);

  mole.classList.remove("up");
  setTimeout(() => mole.remove(), 200);

  updateHUD();
  save();

  const cfg = getCfg(game.level);
  if (game.hit >= cfg.goal) endRound(true);
}

function updateHUD() {
  document.getElementById("hudLevel").textContent = game.level;
  document.getElementById("hudTime").textContent = game.timeLeft;
  document.getElementById("hudHit").textContent = game.hit;
  document.getElementById("hudGoal").textContent = getCfg(game.level).goal;
}

function endRound(passed) {
  game.playing = false;
  clearTimeout(game.spawnTimer);
  game.timers.forEach(clearInterval);
  game.timers = [];
  document.querySelectorAll(".mole").forEach(m => m.remove());

  const cfg = getCfg(game.level);
  const passedNow = passed || (game.hit >= cfg.goal);
  const bonus = passedNow ? cfg.reward : 0;
  if (passedNow) state.coins += bonus;

  const arena = document.getElementById("arena");
  const div = document.createElement("div");
  div.className = "game-result";
  if (passedNow) {
    div.innerHTML = `
      <h2>过关！</h2>
      <p>第 ${game.level} 关完成<br>奖励 <b style="color:#ffd700">+${bonus}</b> 金币</p>
      <div class="btns">
        <button class="btn-retry" onclick="nextRound()">下一关</button>
        <button class="btn-exit" onclick="quitGame()">离开</button>
      </div>`;
  } else {
    div.innerHTML = `
      <h2>差一点点</h2>
      <p>命中 ${game.hit}/${cfg.goal} 只<br>本次获得 <b style="color:#ffd700">+${game.hit * 10}</b> 金币</p>
      <div class="btns">
        <button class="btn-retry" onclick="retryRound()">再来一次</button>
        <button class="btn-exit" onclick="quitGame()">离开</button>
      </div>`;
  }
  arena.appendChild(div);
  save(); render();
}

function nextRound() {
  document.querySelector(".game-result")?.remove();
  game.level++;
  countDownThenPlay();
}
function retryRound() {
  document.querySelector(".game-result")?.remove();
  countDownThenPlay();
}
function quitGame() {
  game.playing = false;
  clearTimeout(game.spawnTimer);
  game.timers.forEach(clearInterval);
  game.timers = [];
  document.querySelectorAll(".mole").forEach(m => m.remove());
  document.querySelector(".game-result")?.remove();
  document.getElementById("gameOverlay").classList.remove("active");
  save(); render();
}

// ===== 冒险模式（横版跳跃） =====
const advCanvas = document.getElementById("advCanvas");
const advCtx = advCanvas.getContext("2d");
const AWW = advCanvas.width, AHH = advCanvas.height;

const advKeys = { left: false, right: false, jump: false };
const advKeyMap = {
  ArrowLeft: "left", a: "left", A: "left",
  ArrowRight: "right", d: "right", D: "right",
  ArrowUp: "jump", w: "jump", W: "jump", " ": "jump"
};
let advHandlerInstalled = false;
function installAdvInput() {
  if (advHandlerInstalled) return;
  advHandlerInstalled = true;
  window.addEventListener("keydown", e => {
    if (!document.getElementById("advOverlay").classList.contains("active")) return;
    if (advKeyMap[e.key] !== undefined) { advKeys[advKeyMap[e.key]] = true; e.preventDefault(); }
  });
  window.addEventListener("keyup", e => {
    if (advKeyMap[e.key] !== undefined) advKeys[advKeyMap[e.key]] = false;
  });
}
function bindAdvTouch(el, key) {
  const on  = e => { e.preventDefault(); advKeys[key] = true; };
  const off = e => { e.preventDefault(); advKeys[key] = false; };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointerleave", off);
  el.addEventListener("pointercancel", off);
}

let advP, advEn, advCn, advCam, advLives, advCoins, advState, advParts, advRAF;

function advReset() {
  advP = { x: ADV_LEVEL.spawnX, y: ADV_GROUND_Y - 40, w: 36, h: 40, vx: 0, vy: 0, onGround: false, facing: 1, invincible: 0 };
  advEn = ADV_LEVEL.enemies.map(e => ({ x: e.x, y: e.y - 28, w: 32, h: 28, vx: 0.8, dir: 1, startX: e.x, range: e.range, alive: true, squash: 0 }));
  advCn = ADV_LEVEL.coins.map(c => ({ x: c[0], y: c[1], taken: false }));
  advCam = { x: 0 };
  advLives = 3;
  advCoins = 0;

  advState = "ready";
  advUpdateHUD();
}
function advUpdateHUD() {
  document.getElementById("advCoin").textContent = advCoins;
  document.getElementById("advLife").textContent = advLives;
  const prog = Math.min(100, Math.floor((advP.x - ADV_LEVEL.spawnX) / (ADV_LEVEL.flagX - ADV_LEVEL.spawnX) * 100));
  document.getElementById("advProg").textContent = prog + "%";
}
function advAABB(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function advSolids() { return ADV_LEVEL.solids.concat(ADV_LEVEL.pipes); }

function advUpdate() {
  if (advState !== "playing") return;
  if (advKeys.left)  { advP.vx -= 0.5; advP.facing = -1; }
  if (advKeys.right) { advP.vx += 0.5; advP.facing = 1; }
  advP.vx = Math.max(-5, Math.min(5, advP.vx));
  // 只在地面摩擦，空中保持惯性
  if (advP.onGround && !advKeys.left && !advKeys.right) advP.vx *= 0.8;
  if (advKeys.jump && advP.onGround) { advP.vy = -12.5; advP.onGround = false; sfxJump(); }
  advP.vy += 0.5;
  if (advP.vy > 13) advP.vy = 13;

  advP.x += advP.vx;
  for (const s of advSolids()) {
    if (advAABB(advP, s)) {
      if (advP.vx > 0) advP.x = s.x - advP.w;
      else if (advP.vx < 0) advP.x = s.x + s.w;
      advP.vx = 0;
    }
  }
  if (advP.x < 0) advP.x = 0;

  advP.y += advP.vy;
  advP.onGround = false;
  for (const s of advSolids()) {
    if (advAABB(advP, s)) {
      if (advP.vy > 0) { advP.y = s.y - advP.h; advP.vy = 0; advP.onGround = true; }
      else if (advP.vy < 0) { advP.y = s.y + s.h; advP.vy = 0; }
    }
  }
  if (advP.y > AHH + 100) { advLose(); return; }

  for (const en of advEn) {
    if (!en.alive) { if (en.squash > 0) en.squash--; continue; }
    en.x += en.vx * en.dir;
    if (en.x < en.startX - en.range || en.x > en.startX + en.range) en.dir *= -1;
    if (advP.invincible > 0) { advP.invincible--; continue; }
    if (advAABB(advP, en)) {
      if (advP.vy > 0 && advP.y + advP.h - en.y < 18) {
        en.alive = false; en.squash = 30;
        advP.vy = -9;
        advCoins += 5;
        sfxStomp();
        advParticles(en.x + en.w/2, en.y, "#7ccb92");
      } else { advLose(); return; }
    }
  }
  for (const c of advCn) {
    if (c.taken) continue;
    const dx = c.x - (advP.x + advP.w/2);
    const dy = c.y - (advP.y + advP.h/2);
    if (dx*dx + dy*dy < 30*30) {
      c.taken = true; advCoins++;
      sfxCoin();
      advParticles(c.x, c.y, "#ffd700");
    }
  }
  if (advP.x > ADV_LEVEL.flagX) { advWin(); return; }
  for (const p of advParts) { p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--; }
  advParts = advParts.filter(p => p.life > 0);

  const targetCam = advP.x - AWW/2;
  advCam.x += (targetCam - advCam.x) * 0.1;
  advCam.x = Math.max(0, Math.min(ADV_LEVEL.width - AWW, advCam.x));
  advUpdateHUD();
}
function advParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    advParts.push({ x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4 - 2, life: 30, color });
  }
}
function advLose() {
  advLives--;
  if (advLives <= 0) {
    advState = "over";
    document.getElementById("advEndTitle").textContent = "游戏结束";
    document.getElementById("advEndText").innerHTML = `收集金币: <b style="color:#ffd700">${advCoins}</b>`;
    document.getElementById("advEndModal").classList.remove("hidden");
  } else {
    advP.x = ADV_LEVEL.spawnX;
    advP.y = ADV_GROUND_Y - 40;
    advP.vx = 0; advP.vy = 0;
    advP.invincible = 90;
  }
  advUpdateHUD();
}
function advWin() {
  advState = "win";
  document.getElementById("advEndTitle").textContent = "通关啦！";
  document.getElementById("advEndText").innerHTML = `收集金币: <b style="color:#ffd700">${advCoins}</b> · 剩余生命: <b style="color:#ff8fb3">${advLives}</b>`;
  document.getElementById("advEndModal").classList.remove("hidden");
}

function advDrawTurtle(x, y, facing, inv) {
  advCtx.save();
  advCtx.translate(x + 18, y + 20);
  advCtx.scale(facing, 1);
  if (inv > 0 && Math.floor(inv/5) % 2 === 0) advCtx.globalAlpha = 0.4;
  advCtx.fillStyle = "#5a9e6e";
  advCtx.beginPath(); advCtx.ellipse(-8, 16, 6, 4, 0, 0, Math.PI*2); advCtx.fill();
  advCtx.beginPath(); advCtx.ellipse(10, 16, 6, 4, 0, 0, Math.PI*2); advCtx.fill();
  advCtx.fillStyle = "#6bbf8a";
  advCtx.beginPath(); advCtx.ellipse(0, 0, 18, 14, 0, 0, Math.PI*2); advCtx.fill();
  advCtx.strokeStyle = "#4a9e6b"; advCtx.lineWidth = 1.5;
  advCtx.beginPath(); advCtx.ellipse(0, 0, 12, 9, 0, 0, Math.PI*2); advCtx.stroke();
  advCtx.fillStyle = "#7ccb92";
  advCtx.beginPath(); advCtx.arc(18, -4, 9, 0, Math.PI*2); advCtx.fill();
  advCtx.fillStyle = "#2c3e50";
  advCtx.beginPath(); advCtx.arc(22, -6, 1.8, 0, Math.PI*2); advCtx.fill();
  advCtx.restore();
}
function advDrawEnemy(en) {
  advCtx.save();
  advCtx.translate(en.x + en.w/2, en.y + en.h/2);
  if (!en.alive) {
    advCtx.scale(1, 0.3);
    advCtx.fillStyle = "#8a5a3a";
    advCtx.beginPath(); advCtx.ellipse(0, 0, 16, 10, 0, 0, Math.PI*2); advCtx.fill();
  } else {
    advCtx.fillStyle = "#8a5a3a";
    advCtx.beginPath(); advCtx.ellipse(0, 0, 14, 12, 0, 0, Math.PI*2); advCtx.fill();
    advCtx.fillStyle = "#5a3a24";
    const legOff = Math.sin(Date.now()/100 + en.x) * 2;
    advCtx.beginPath(); advCtx.ellipse(-6, 10 + legOff, 3, 3, 0, 0, Math.PI*2); advCtx.fill();
    advCtx.beginPath(); advCtx.ellipse(6, 10 - legOff, 3, 3, 0, 0, Math.PI*2); advCtx.fill();
    advCtx.fillStyle = "white";
    advCtx.beginPath(); advCtx.arc(-4, -3, 3, 0, Math.PI*2); advCtx.fill();
    advCtx.beginPath(); advCtx.arc(4, -3, 3, 0, Math.PI*2); advCtx.fill();
    advCtx.fillStyle = "#2c3e50";
    advCtx.beginPath(); advCtx.arc(-4, -3, 1.5, 0, Math.PI*2); advCtx.fill();
    advCtx.beginPath(); advCtx.arc(4, -3, 1.5, 0, Math.PI*2); advCtx.fill();
  }
  advCtx.restore();
}
function advDrawCoin(c, t) {
  if (c.taken) return;
  advCtx.save();
  advCtx.translate(c.x, c.y + Math.sin(t/200 + c.x)*2);
  const squash = Math.abs(Math.sin(t/300 + c.x));
  advCtx.scale(squash, 1);
  advCtx.fillStyle = "#ffd700";
  advCtx.strokeStyle = "#d4a017"; advCtx.lineWidth = 2;
  advCtx.beginPath(); advCtx.arc(0, 0, 9, 0, Math.PI*2); advCtx.fill(); advCtx.stroke();
  advCtx.restore();
}
function advDraw(t) {
  const grad = advCtx.createLinearGradient(0, 0, 0, AHH);
  grad.addColorStop(0, "#87ceeb");
  grad.addColorStop(1, "#c9e9f5");
  advCtx.fillStyle = grad;
  advCtx.fillRect(0, 0, AWW, AHH);
  advCtx.fillStyle = "rgba(255,255,255,0.8)";
  for (let i = 0; i < 5; i++) {
    const cx = ((i*400 - advCam.x*0.3) % (AWW+200) + AWW+200) % (AWW+200) - 100;
    const cy = 50 + (i%3)*35;
    advCtx.beginPath();
    advCtx.arc(cx, cy, 18, 0, Math.PI*2);
    advCtx.arc(cx+22, cy-5, 22, 0, Math.PI*2);
    advCtx.arc(cx+44, cy, 18, 0, Math.PI*2);
    advCtx.fill();
  }
  advCtx.save();
  advCtx.translate(-advCam.x, 0);
  for (const s of ADV_LEVEL.solids) {
    if (s.x + s.w < advCam.x - 50 || s.x > advCam.x + AWW + 50) continue;
    if (s.type === "ground") {
      advCtx.fillStyle = "#7cc47a";
      advCtx.fillRect(s.x, s.y, s.w, 12);
      advCtx.fillStyle = "#a0754f";
      advCtx.fillRect(s.x, s.y + 12, s.w, s.h - 12);
    } else {
      advCtx.fillStyle = "#e8924a";
      advCtx.fillRect(s.x, s.y, s.w, s.h);
      advCtx.strokeStyle = "#b86830"; advCtx.lineWidth = 2;
      advCtx.strokeRect(s.x, s.y, s.w, s.h);
    }
  }
  for (const p of ADV_LEVEL.pipes) {
    advCtx.fillStyle = "#3cb371";
    advCtx.fillRect(p.x, p.y, p.w, p.h);
    advCtx.fillStyle = "#2d8a55";
    advCtx.fillRect(p.x, p.y, p.w, 8);
  }
  const fx = ADV_LEVEL.flagX;
  advCtx.strokeStyle = "#888"; advCtx.lineWidth = 6;
  advCtx.beginPath(); advCtx.moveTo(fx, ADV_GROUND_Y - 180); advCtx.lineTo(fx, ADV_GROUND_Y); advCtx.stroke();
  advCtx.fillStyle = "#ff5c5c";
  advCtx.beginPath();
  advCtx.moveTo(fx, ADV_GROUND_Y - 180);
  advCtx.lineTo(fx - 50, ADV_GROUND_Y - 165);
  advCtx.lineTo(fx, ADV_GROUND_Y - 150);
  advCtx.closePath(); advCtx.fill();
  advCtx.fillStyle = "#888";
  advCtx.fillRect(fx - 15, ADV_GROUND_Y - 10, 30, 10);
  for (const c of advCn) advDrawCoin(c, t);
  for (const en of advEn) advDrawEnemy(en);
  advDrawTurtle(advP.x, advP.y, advP.facing, advP.invincible);
  for (const p of advParts) {
    advCtx.globalAlpha = p.life / 30;
    advCtx.fillStyle = p.color;
    advCtx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  advCtx.globalAlpha = 1;
  advCtx.restore();
}
function advLoop(t) {
  advUpdate();
  advDraw(t || 0);
  if (document.getElementById("advOverlay").classList.contains("active")) {
    advRAF = requestAnimationFrame(advLoop);
  }
}
function startAdventure() {
  installAdvInput();
  bindAdvTouch(document.getElementById("advLeft"), "left");
  bindAdvTouch(document.getElementById("advRight"), "right");
  bindAdvTouch(document.getElementById("advJump"), "jump");
  document.getElementById("advOverlay").classList.add("active");
  document.getElementById("advStartModal").classList.remove("hidden");
  document.getElementById("advEndModal").classList.add("hidden");
  advReset();
}
function beginAdventure() {
  document.getElementById("advStartModal").classList.add("hidden");
  advState = "playing";
  cancelAnimationFrame(advRAF);
  advRAF = requestAnimationFrame(advLoop);
}
function retryAdventure() {
  document.getElementById("advEndModal").classList.add("hidden");
  advReset();
  advState = "playing";
}
function quitAdventure() {
  advState = "stopped";
  cancelAnimationFrame(advRAF);
  advKeys.left = advKeys.right = advKeys.jump = false;
  document.getElementById("advOverlay").classList.remove("active");
  save(); render();
}

    owned.push(id);
    state.wardrobe[cat] = id;
    toast("购买成功，已穿上！");

// ===== 主循环 =====
let lastSecond = Date.now();
function tick() {
  const now = Date.now();
  const dt = (now - lastSecond) / 1000;
  lastSecond = now;

  // 每秒收益
  const rate = getCoinRate();
  state.coins += rate * dt;
  state.age += dt;
  state.expInLevel += dt;

  // 状态自然下降（每秒）
  state.hungry = clamp(state.hungry - 0.3 * dt, 0, 100);
  state.mood   = clamp(state.mood   - 0.25 * dt, 0, 100);
  state.clean  = clamp(state.clean  - 0.2  * dt, 0, 100);

  // 心情/饱食太低时收益减少（getCoinRate 已按平均状态算）
  checkLevelUp();
  render();
  save();
}

// ===== BGM + 音效（Web Audio 合成，无需外部文件） =====
let bgmCtx = null, bgmGain = null, bgmOn = true, bgmStep = 0, bgmTimer = null;
const BGM_TEMPO = 112;
const BGM_MELODY = [
  {m:76,d:1},{m:79,d:1},{m:81,d:1},{m:84,d:2},{m:81,d:1},{m:79,d:1},
  {m:76,d:2},{m:74,d:1},{m:76,d:1},{m:79,d:1},{m:74,d:2},{m:72,d:2},
  {m:74,d:1},{m:76,d:1},{m:81,d:1},{m:79,d:1},{m:76,d:2},{m:72,d:1},{m:74,d:1},
  {m:76,d:2},{m:79,d:1},{m:81,d:1},{m:84,d:2},{m:81,d:1},{m:79,d:1},
  {m:76,d:2},{m:74,d:1},{m:72,d:1},{m:74,d:2},{m:72,d:1},{m:69,d:1},{m:72,d:2}
];
const BGM_BASS = [
  {m:48,d:2},{m:48,d:1},{m:55,d:1},{m:53,d:2},{m:55,d:1},{m:53,d:1},
  {m:52,d:2},{m:50,d:2},{m:48,d:2},{m:50,d:2},
  {m:48,d:2},{m:55,d:2},{m:53,d:2},{m:50,d:2},
  {m:48,d:2},{m:55,d:2},{m:52,d:2},{m:50,d:1},{m:53,d:1}
];
function midiToFreq(m){ return m<=0?0:440*Math.pow(2,(m-69)/12); }
function ensureBGM(){
  if(bgmCtx) return;
  bgmCtx = new (window.AudioContext||window.webkitAudioContext)();
  bgmGain = bgmCtx.createGain();
  bgmGain.gain.value = 0.16;
  bgmGain.connect(bgmCtx.destination);
}
function playNote(m, when, dur, type, vol){
  if(m<=0) return;
  const osc = bgmCtx.createOscillator();
  const g = bgmCtx.createGain();
  osc.type = type; osc.frequency.value = midiToFreq(m);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  osc.connect(g); g.connect(bgmGain);
  osc.start(when); osc.stop(when+dur+0.05);
}
function scheduleBGM(){
  if(!bgmCtx || !bgmOn) return;
  const beat = 60/BGM_TEMPO;
  const startS = bgmCtx.currentTime + 0.1;
  let t = 0;
  for(let i=0;i<8;i++){
    const k = (bgmStep+i) % Math.max(BGM_MELODY.length, BGM_BASS.length);
    const mel = BGM_MELODY[k % BGM_MELODY.length];
    const bas = BGM_BASS[k % BGM_BASS.length];
    playNote(mel.m, startS+t, mel.d*beat*0.9, "triangle", 0.25);
    playNote(bas.m, startS+t, bas.d*beat*0.9, "sine", 0.30);
    t += mel.d*beat;
  }
  bgmStep += 8;
  bgmTimer = setTimeout(scheduleBGM, Math.max(50, t*1000 - 200));
}
function toggleBGM(){
  ensureBGM();
  bgmCtx.resume();
  if(bgmOn){ bgmOn=false; clearTimeout(bgmTimer); }
  else { bgmOn=true; bgmStep=0; scheduleBGM(); }
  document.getElementById("bgmTxt").textContent = bgmOn?"音乐":"静音";
  document.getElementById("bgmBtn").style.opacity = bgmOn?1:0.5;
}
function sfxPlay(freq0, freq1, dur, type, vol, sweep){
  if(!bgmCtx) ensureBGM();
  if(!bgmCtx) return;
  const t = bgmCtx.currentTime;
  const osc = bgmCtx.createOscillator();
  const g = bgmCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq0, t);
  if(sweep) osc.frequency.exponentialRampToValueAtTime(freq1, t+dur);
  else osc.frequency.setValueAtTime(freq1, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  osc.connect(g); g.connect(bgmGain);
  osc.start(t); osc.stop(t+dur+0.03);
}
function sfxJump(){ sfxPlay(300, 700, 0.22, "triangle", 0.25, true); }
function sfxStomp(){ sfxPlay(500, 120, 0.18, "square", 0.28, true); }
function sfxCoin(){ sfxPlay(880, 1320, 0.12, "triangle", 0.22, true); }
function sfxLevel(){ sfxPlay(523, 784, 0.1, "triangle", 0.3, false); setTimeout(()=>sfxPlay(659,988,0.1,"triangle",0.3,false),90); setTimeout(()=>sfxPlay(784,1175,0.14,"triangle",0.3,false),180); }
function sfxBoost(){ sfxPlay(200, 900, 0.25, "sine", 0.2, true); }
function sfxFeed(){ sfxPlay(400, 300, 0.1, "triangle", 0.2, true); }
document.addEventListener("pointerdown", function once(){
  ensureBGM(); bgmCtx.resume();
  scheduleBGM();

}, { once:true });

async function hashPass(pw) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("turtle-salt-" + pw));

        <svg viewBox="0 0 80 60" width="60">
          <ellipse cx="40" cy="38" rx="26" ry="18" fill="${t.shell}"/>
          <circle cx="62" cy="32" r="9" fill="${t.shell}"/>
          <circle cx="65" cy="30" r="1.5" fill="#222"/>
        </svg>
      </div>
      <div class="tname">${t.name}${t.me ? "（我）" : ""}</div>
      <div class="tid">${t.id}</div>
      <div class="tstats">Lv.${t.level} · 🪙${t.coins}</div>
      ${t.me ? "" : '<div class="visit-hint">👆 点我去他家</div>'}
    </div>`;
}

// 拜访别人家（简单版：看乌龟信息 + 留言入口）
let visiting = null;
function visitTurtle(name) {
  visiting = name;
  document.getElementById("visitOverlay").classList.remove("hidden");
  renderVisit(name);
}
function closeVisit() {
  visiting = null;
  document.getElementById("visitOverlay").classList.add("hidden");
}
function renderVisit(name) {
  const bot = TURTLE_BOTS.find(b => b.name === name);
  const info = bot ? bot : { name: name, level: 1, coins: 0, shell: "#6bbf8a" };
  document.getElementById("visitName").textContent = info.name + " 的家";
  document.getElementById("visitLevel").textContent = "Lv." + (info.level || 1);
  document.getElementById("visitCoins").textContent = "🪙" + (info.coins || 0);
  document.getElementById("visitShell").innerHTML =
    '<svg viewBox="0 0 200 160" width="150">' +
      '<ellipse cx="25" cy="90" rx="10" ry="6" fill="#5a9e6e"/>' +
      '<ellipse cx="55" cy="125" rx="14" ry="9" fill="#5a9e6e"/>' +
      '<ellipse cx="130" cy="125" rx="14" ry="9" fill="#5a9e6e"/>' +
      '<ellipse cx="55" cy="55" rx="12" ry="8" fill="#6ab57e"/>' +
      '<ellipse cx="130" cy="55" rx="12" ry="8" fill="#6ab57e"/>' +
      '<ellipse cx="90" cy="90" rx="60" ry="45" fill="' + info.shell + '"/>' +
      '<ellipse cx="90" cy="90" rx="45" ry="32" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>' +
      '<circle cx="155" cy="85" r="22" fill="#7ccb92"/>' +
      '<circle cx="163" cy="80" r="4" fill="#2c3e50"/>' +
      '<circle cx="164" cy="79" r="1.3" fill="white"/>' +
      '<path d="M 165 92 Q 170 95 175 92" stroke="#2c3e50" stroke-width="1.5" fill="none"/>' +
    '</svg>';
}

// ---- 启动时检查登录状态 ----
(function initAuth() {
  const saved = localStorage.getItem("turtleUser");
  if (saved) {
    finishLogin(saved);   // 有记忆就自动登录
  } else {
    showAuth();           // 否则显示登录界面
  }
})();
</script>
